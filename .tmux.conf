# =========================================================
#  ~/.tmux.conf  (WSL Ubuntu / tmux 3.2a)
# =========================================================

# ---- prefix: Ctrl-b -> Ctrl-a ----------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # Ctrl-a 連打で本来の Ctrl-a を送る

# ---- 基本動作 --------------------------------------------
set -g mouse on               # マウスで pane選択 / リサイズ / スクロール
setw -g mode-keys vi          # copy-mode を vi 風に
set -sg escape-time 0         # ESC の遅延を無くす (vim のため)
set -g history-limit 50000    # スクロールバック行数
set -g focus-events on        # vim の autoread 等に有効
set -g base-index 1           # window 番号を 1 始まり
setw -g pane-base-index 1     # pane 番号を 1 始まり
set -g renumber-windows on    # window を閉じたら番号を詰める
set -g display-time 2000      # メッセージ表示時間(ms)

# ---- 色 (256色 / truecolor) ------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# ---- 設定リロード: prefix + r ----------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded!"

# ---- 分割: | は縦 / - は横 (カレントパスを引き継ぐ) -------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# 新規 window もカレントパスから
bind c new-window -c "#{pane_current_path}"

# ---- vim 風 pane 移動 (prefix + hjkl) --------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- pane リサイズ (prefix + HJKL, 連続可) ---------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- copy-mode (vi) --------------------------------------
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y / Enter / マウス選択 -> Windows クリップボードへ (clip.exe)
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# =========================================================
#  配色: 緑蛍光管 (Nostromo CRT)
# =========================================================
# 色は .wezterm.lua のパレットと同じ値を直接書いている。
#
# テーマプラグインを使わないのは、外部テーマが truecolor の hex を
# そのまま吐くから。WezTerm 側の ANSI パレットを一切経由しないので、
# 端末をどれだけ単色に作り込んでもステータスラインだけ素の色が出て、
# 「緑しか出ない管」という嘘がそこで破れる。
#
# 記号は CP437 の範囲 (░▒▓│■) だけを使っている。Nerd Font の
# powerline セパレータはセル 8x16 に対して正方形なので、
# 横 1 セルに収めると縦が半分になって崩れる (.wezterm.lua のコメント参照)。

# ---- ステータスライン全体 --------------------------------
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#071808,fg=#2CB837"

# 左: セッション名。prefix 押下中は反転して光る
set -g status-left-length 40
set -g status-left "#[bg=#17701E,fg=#C9FFCE,bold] #S #{?client_prefix,#[bg=#79F283]#[fg=#030B04]#[bold] ■ ,}#[bg=#071808,fg=#17701E,nobold]▓▒░ "

# 右: ホスト名と時刻
set -g status-right-length 60
set -g status-right "#[fg=#17701E]░▒▓#[bg=#17701E,fg=#79F283] #h #[bg=#1D8025,fg=#C9FFCE,bold] %Y-%m-%d %H:%M "

# ---- window リスト ---------------------------------------
setw -g window-status-format         "#[fg=#1D8C26] #I #W "
setw -g window-status-current-format "#[bg=#1D8025,fg=#C9FFCE,bold] #I #W "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#C9FFCE,blink"
setw -g window-status-bell-style     "fg=#030B04,bg=#79F283,bold"

# ---- pane 境界 -------------------------------------------
# 単色管は灰色を出せないので、非アクティブ側も緑のまま暗くするだけ
set -g pane-border-style        "fg=#155C1B"
set -g pane-active-border-style "fg=#39CF45"
set -g display-panes-colour        "#1D8C26"
set -g display-panes-active-colour "#79F283"

# ---- メッセージ / copy-mode ------------------------------
set -g message-style         "bg=#17701E,fg=#C9FFCE,bold"
set -g message-command-style "bg=#0F3412,fg=#42E550"
set -g mode-style            "bg=#1D8025,fg=#C9FFCE"
set -g clock-mode-colour "#39CF45"
set -g clock-mode-style  24

# =========================================================
#  Plugins (TPM)
# =========================================================
# 注意: TPM 本体 (~/.tmux/plugins/tpm) が無いと下の run 行は黙って失敗し、
# ここの @plugin 指定はすべて無効になる。導入は
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# のあと tmux 内で prefix + I。
# 配色はプラグインに依存させていないので、TPM が無くても上の見た目は出る。
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # vim<->tmux を Ctrl-hjkl で移動
set -g @plugin 'tmux-plugins/tmux-resurrect'      # セッション保存/復元
set -g @plugin 'tmux-plugins/tmux-continuum'      # 自動保存/復元

# ---- continuum: 起動時に復元 / 15分ごとに自動保存 -------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---- TPM 起動 (この行は必ず最後) -------------------------
run '~/.tmux/plugins/tpm/tpm'
